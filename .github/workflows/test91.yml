name: Replace-boot-and-system

on:
  push:
    branches:
      - yoko  # 実行するブランチを指定

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
  MANIFEST_BRANCH: 'twrp-9.0'
  DEVICE_TREE_URL: 'https://github.com/coara-chocomaru/test-ctab'
  DEVICE_TREE_BRANCH: 'yoko'
  DEVICE_PATH: 'device/sts/a05ba'
  DEVICE_NAME: 'a05ba'
  MAKEFILE_NAME: 'omni_a05ba'
  BUILD_TARGET: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ env.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ env.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ env.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ env.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ env.DEVICE_PATH }}"
          echo "Device Name: ${{ env.DEVICE_NAME }}"
          echo "Makefile Name: ${{ env.MAKEFILE_NAME }}"
          echo "Build Target: ${{ env.BUILD_TARGET }}.img"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v3

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare the environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Asia/Tokyo
          sudo apt update
          sudo apt-get install -y tzdata
          sudo apt -y upgrade
          sudo apt -y install \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush \
            schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
            qemu-user-static libstdc++-10-dev libncurses5 python3 libtinfo5 \
            openssl python2.7 python2.7-dev git wget xxd python3-cryptography zip curl \
            python3-pycryptodome

      - name: Install OpenJDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '8'

      - name: Setup SSH Keys
        if: startsWith(env.MANIFEST_URL, 'git@github.com')
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
          git config --global user.name "azwhikaru"
          git config --global user.email "azwhikaru+37921907@github.com"
          repo init --depth=1 \
            -u ${{ env.MANIFEST_URL }} \
            -b ${{ env.MANIFEST_BRANCH }}

      - name: Repo Sync
        working-directory: workspace
        run: |
          repo sync -j$(nproc --all) --force-sync

      - name: Move files to workspace
        run: |
          mkdir -p workspace/${{ env.DEVICE_PATH }}
          ls | grep -v workspace | xargs -I{} mv {} workspace/${{ env.DEVICE_PATH }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Switch to Python 2
        run: |
          sudo apt -y install python2
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
          python --version

      - name: Buildi
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.MAKEFILE_NAME }}-eng
          make clean
          make fec -j$(nproc --all)

      - name: Install built fec to PATH
        run: |
          sudo cp ${{ steps.pwd.outputs.workspace-folder }}/out/host/linux-x86/bin/fec /usr/local/bin/fec
          sudo chmod +x /usr/local/bin/fec
          fec --version || fec --help || true

      - name: Clone avbtool 1.1.0 from AOSP android-9.0.0_r34
        run: git clone --depth 1 --branch android-9.0.0_r34 https://android.googlesource.com/platform/external/avb

      - name: Clone nccgroup test_avb_key
        run: git clone https://github.com/nccgroup/test_avb_key nccgroup-avb

      - name: Clone haha-you-used-testkeys (AOSP testkey)
        run: git clone https://github.com/alltechdev/haha-you-used-testkeys haha-tool

      - name: Download Neo.zip
        run: wget -O Next-2.7z https://github.com/coara-chocomaru/monooki/releases/download/%E3%81%A7%E3%83%BC%E3%81%9F2/Next-2.7z

      - name: Extract images
        run: |
            7z x Next-2.7z -pctz -o. -aoa -y
            ls -la *.img

      - name: Create working directories
        run: mkdir -p signed keys

      # ============================================================
      # ここから下が「署名と再構築」セクション
      #   - boot.img   : NONE / sha256 / partition_size=33554432
      #   - system.img : NONE / sha1  / fec_roots=2 / partition_size=2684354560
      #   - vbmeta.img : SHA256_RSA2048 (AOSP testkey) で再構築
      # ============================================================

      - name: info boot
        run: |
         python avb/avbtool info_image --image boot.img

      - name: info system
        run: |
         python avb/avbtool info_image --image system.img

      - name: info vendor
        run: |
         python avb/avbtool info_image --image vendor.img

      - name: info dtbo
        run: |
         python avb/avbtool info_image --image dtbo.img

      - name: info recovery
        run: |
         python avb/avbtool info_image --image recovery.img

      - name: info vbmeta
        run: |
         python avb/avbtool info_image --image vbmeta.img

      - name: Deploy vbmeta key (AOSP testkey)
        run: |
          cp haha-tool/keys/vbmeta.pem keys/vbmeta.pem
          cp haha-tool/keys/vbmeta.pem keys/vbmeta.avbpubkey

      - name: Install Python2 crypto libs
        run: |
          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py -o get-pip.py
          python get-pip.py
          python -m pip install --upgrade "pip<21"
          python -m pip install "setuptools<45"
          python -m pip uninstall -y pycryptodome || true
          python -m pip install "pycrypto==2.6.1"

      - name: Set fixed salt (matches original system/boot)
        run: echo "FIXED_SALT=5fb2cc12e4c24f4da2b374b90b1af1ff3ce487dd4afc9fa0e32423d35811a003" >> $GITHUB_ENV

      - name: Set original partition sizes (hard-coded)
        run: |
          echo "BOOT_PARTITION_SIZE=33554432"   >> $GITHUB_ENV
          echo "SYSTEM_PARTITION_SIZE=2684354560" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # boot.img への再署名
      #   元の boot は Algorithm=NONE / sha256 / partition_size=33554432
      # ------------------------------------------------------------------
      - name: Sign boot.img => signed/boot.img (NONE / sha256 / 33554432)
        run: |
          cd $GITHUB_WORKSPACE
          cp boot.img signed/boot.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/boot.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hash_footer \
            --image signed/boot.img \
            --partition_name boot \
            --partition_size $BOOT_PARTITION_SIZE \
            --hash_algorithm sha256 \
            --algorithm NONE \
            --salt $FIXED_SALT

      - name: Verify signed boot.img size
        run: |
          cd $GITHUB_WORKSPACE
          ACTUAL=$(stat -c%s signed/boot.img)
          echo "signed/boot.img size: $ACTUAL (expected: 33554432)"
          if [ "$ACTUAL" != "33554432" ]; then
            echo "ERROR: boot.img size mismatch!"
            exit 1
          fi

      # ------------------------------------------------------------------
      # system.img への再署名
      #   元の system は Algorithm=NONE / sha1 / fec_roots=2
      #   partition_size=2684354560 で元と同一サイズに強制
      # ------------------------------------------------------------------
      - name: Sign system.img => signed/system.img (NONE / sha1 / fec 2 / 2684354560)
        run: |
          cd $GITHUB_WORKSPACE
          export HOST_OUT=${{ steps.pwd.outputs.workspace-folder }}/out/host/linux-x86
          export LD_LIBRARY_PATH="$HOST_OUT/lib64:$HOST_OUT/lib:${LD_LIBRARY_PATH}"
          export PATH="$HOST_OUT/bin:/usr/local/bin:${PATH}"
          cp system.img signed/system.img
          python $GITHUB_WORKSPACE/avb/avbtool erase_footer --image signed/system.img 2>/dev/null || true
          python $GITHUB_WORKSPACE/avb/avbtool add_hashtree_footer \
            --image signed/system.img \
            --partition_name system \
            --setup_as_rootfs_from_kernel \
            --partition_size $SYSTEM_PARTITION_SIZE \
            --hash_algorithm sha1 \
            --fec_num_roots 2 \
            --algorithm NONE \
            --salt $FIXED_SALT

      - name: Verify signed system.img size (must be 2684354560)
        run: |
          cd $GITHUB_WORKSPACE
          ACTUAL=$(stat -c%s signed/system.img)
          echo "signed/system.img size: $ACTUAL (expected: 2684354560)"
          if [ "$ACTUAL" != "2684354560" ]; then
            echo "ERROR: system.img size mismatch!"
            exit 1
          fi

      - name: Show signed system info
        run: python avb/avbtool info_image --image signed/system.img

      # ------------------------------------------------------------------
      # vbmeta.img の再構築
      #   元 vbmeta と同じく全 descriptor をインラインで格納する構成
      #   - boot / system  : 署名済みイメージから descriptor を取り込む
      #   - vendor/dtbo/recovery : 元イメージから descriptor を取り込む
      # ------------------------------------------------------------------
      - name: Build vbmeta image (all descriptors inline)
        run: |
          cd $GITHUB_WORKSPACE
          python $GITHUB_WORKSPACE/avb/avbtool make_vbmeta_image \
            --output signed/vbmeta.img \
            --key keys/vbmeta.pem \
            --algorithm SHA256_RSA2048 \
            --include_descriptors_from_image signed/boot.img \
            --include_descriptors_from_image signed/system.img \
            --include_descriptors_from_image vendor.img \
            --include_descriptors_from_image dtbo.img \
            --include_descriptors_from_image recovery.img

      - name: Show vbmeta info
        run: |
          python avb/avbtool info_image --image signed/vbmeta.img
          echo "---hexdump---"
          xxd signed/vbmeta.img | head -30

      - name: Verify with nccgroup test_avb_key
        run: python3 nccgroup-avb/test_avb_key.py signed/vbmeta.img
        continue-on-error: true

      - name: Explicit testkey verification
        run: |
          python avb/avbtool verify_image \
            --image signed/vbmeta.img \
            --key keys/vbmeta.pem

      - name: Zip keys folder
        run: zip -r keys.zip keys/

      - name: Upload keys artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keys
          path: keys.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resigned-boot-and-system
          path: |
            signed/boot.img
            signed/system.img
            signed/vbmeta.img
